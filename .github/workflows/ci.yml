name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npm test

  # O Gateway Local é um pacote à parte (packages/gateway), com as próprias
  # dependências e testes — e até 23/09/2026 nenhum deles rodava aqui: os
  # testes do receptor da Control iD e da contingência offline só rodavam na
  # máquina de quem mexeu. Job separado para uma falha num lado não esconder
  # a do outro.
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm test

  # A ponte Topdata (packages/ponte-topdata) é C# 32 bits compilado com o
  # csc do .NET Framework, que só existe no Windows — por isso o runner é
  # Windows. O build.ps1 compila a ponte e os testes e roda os testes (a
  # máquina de estados real, com a DLL e o gateway falsos). A DLL da
  # Topdata não é instalada aqui e não precisa: os testes não a carregam.
  ponte-topdata:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/ponte-topdata
    steps:
      - uses: actions/checkout@v4

      - run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
