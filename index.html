<!doctype html>
<html lang="pt-BR">

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>ArkeFit — Gestão de Treinos</title>
    <meta name="description" content="Sistema inteligente de gestão de treinos e evolução de alunos — ArkeFit." />

    <meta property="og:title" content="ArkeFit — Gestão de Treinos" />
    <meta property="og:description" content="Sistema inteligente de gestão de treinos e evolução de alunos — ArkeFit." />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Normalize Supabase recovery/invite/verify links for HashRouter.
      // Supabase appends "#access_token=...&type=recovery|invite|signup" to the
      // redirectTo URL. With HashRouter, that produces a second "#" fragment
      // that breaks routing, so we move the tokens into a query string after
      // our own route hash instead — and route to the page that owns that
      // flow: convites (invite/signup) vão para /auth/definir-senha; links de
      // ativação de cadastro (gerar-link-ativacao) também, mesmo usando
      // type=recovery, porque o redirectTo original já apontava pra lá —
      // detectamos isso pelo path que precede os tokens no link. Pedido de
      // "esqueci minha senha" de conta já ativa continua em
      // /auth/reset-password.
      (function () {
        try {
          var href = window.location.href;
          var hasTokens =
            href.indexOf("type=recovery") !== -1 ||
            href.indexOf("type=invite") !== -1 ||
            href.indexOf("type=signup") !== -1 ||
            href.indexOf("access_token=") !== -1 ||
            href.indexOf("error_description=") !== -1;
          if (!hasTokens) return;

          // Find the tokens fragment (last "#" that starts token params).
          var markers = [
            "#access_token=",
            "#error=",
            "#error_description=",
            "#type=recovery",
            "#type=invite",
            "#type=signup",
          ];
          var tokenIdx = -1;
          for (var i = 0; i < markers.length; i++) {
            var idx = href.indexOf(markers[i]);
            if (idx !== -1 && (tokenIdx === -1 || idx < tokenIdx)) tokenIdx = idx;
          }
          // Fallback: sometimes tokens arrive with "&" prefix after the route hash
          if (tokenIdx === -1) {
            var m = href.match(/[#&](access_token|type|error|error_description)=/);
            if (m) tokenIdx = href.indexOf(m[0]);
          }
          if (tokenIdx === -1) return;

          var tokens = href.slice(tokenIdx + 1); // strip leading # or &
          var prefix = href.slice(0, tokenIdx);
          var isInvite =
            tokens.indexOf("type=invite") !== -1 ||
            tokens.indexOf("type=signup") !== -1 ||
            prefix.indexOf("/auth/definir-senha") !== -1;
          var targetPath = isInvite ? "/auth/definir-senha" : "/auth/reset-password";
          var base = window.location.origin + window.location.pathname + window.location.search;
          window.history.replaceState({}, document.title, base + "#" + targetPath + "?" + tokens);
        } catch (e) {
          console.error("recovery url normalize failed", e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
