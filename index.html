    <title>ArkeFit — Gestão de Treinos</title>

    <meta property="og:title" content="ArkeFit — Gestão de Treinos" />

  <body>
    <div id="root"></div>
    <script>
      // Normalize Supabase recovery/verify links for HashRouter.
      // Supabase appends "#access_token=...&type=recovery" to the redirectTo URL.
      // With HashRouter, that produces a second "#" fragment that breaks routing.
      (function () {
        try {
          var href = window.location.href;
          var hasRecovery =
            href.indexOf("type=recovery") !== -1 ||
            href.indexOf("access_token=") !== -1 ||
            href.indexOf("error_description=") !== -1;
          if (!hasRecovery) return;

          // Find the tokens fragment (last "#" that starts token params).
          var markers = ["#access_token=", "#error=", "#error_description=", "#type=recovery"];
          var tokenIdx = -1;
          for (var i = 0; i < markers.length; i++) {
            var idx = href.indexOf(markers[i]);
            if (idx !== -1 && (tokenIdx === -1 || idx < tokenIdx)) tokenIdx = idx;
          }
          // Fallback: sometimes tokens arrive with "&" prefix after the route hash
          if (tokenIdx === -1) {
            var m = href.match(/[#&](access_token|type|error|error_description)=/);
            if (m) tokenIdx = href.indexOf(m[0]);
          }
          if (tokenIdx === -1) return;

          var tokens = href.slice(tokenIdx + 1); // strip leading # or &
          // Route path to reset-password with tokens as a secondary hash-like query
          var base = window.location.origin + window.location.pathname + window.location.search;
          window.history.replaceState({}, document.title, base + "#/auth/reset-password?" + tokens);
        } catch (e) {
          console.error("recovery url normalize failed", e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
